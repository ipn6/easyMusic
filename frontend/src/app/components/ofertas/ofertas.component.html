<div class="container mt-4">
    <h2 class="text-primary">Ofertas para charangas</h2>

    <!-- Sección Crear Oferta -->
     <div *ngIf="user.rol === 'cliente'" class="card p-3 mb-4">
        <h4> Crear oferta</h4>
        <div class="row">
            <div class="col-md-4 mb-2">
                <input type="text" class="form-control" placeholder="Título" [(ngModel)]="nuevaOferta.nombre">
            </div>
            <div class="col-md-4 mb-2">
                <textarea class="form-control" placeholder="Descripción" [(ngModel)]="nuevaOferta.descripcion"></textarea>
            </div>
            <div class="col-md-2 mb-2">
                <input type="date" class="form-control" [(ngModel)]="nuevaOferta.fechaInicio">
            </div>
            <div class="col-md-2 mb-2">
                <input type="date" class="form-control" [(ngModel)]="nuevaOferta.fechaFin">
            </div>
            <div class="col-md-4 mb-2">
                <select class="form-select" [(ngModel)]="nuevaOferta.idProvincia">
                    <option value="">Selecciona una provincia</option>
                    <option *ngFor="let provincia of provincias" [value]="provincia.idProvincia">{{ provincia.nombre }}</option>
                </select>
            </div>
            <div class="col-md-4 mb-2">
                <textarea class="form-control" placeholder="Dirección" [(ngModel)]="nuevaOferta.direccion"></textarea>
            </div>
            <div class="col-md-12 text-end">
                <button class="btn btn-success" (click)="crearOferta()">Publicar</button>
            </div>

</div>
