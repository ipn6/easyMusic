<div class="card" style="width: fit-content;">
      <div class="card-body text-center">
        <img src="/assets/easymusic.png" class="card-img-top" alt="..." style="max-width: 60%; height: auto; margin: 0 auto; display: block;">
        <h2 class="card-title fw-bold mb-3 mt-3">¡Bienvenido!</h2>
        
        <p class="card-text text-muted mb-2">
          Con nuestra aplicación podrás gestionar tus eventos musicales de forma sencilla.
        </p>
        <p class="card-text text-muted mb-4">
          Únete gratis a la comunidad que está revolucionando el mundo de la música.
        </p>
        
        <div class="bg-light rounded-3 p-3 mb-4">
          <h5 class="fw-semibold mb-2">Nuestra comunidad cuenta con:</h5>
          <p class="mb-1"><strong>{{numCharangas}}</strong> Charangas</p>
          <p class="mb-1"><strong>{{numMusicos}}</strong> Músicos</p>
          <p class="mb-0"><strong>{{numClientes}}</strong> Clientes</p>
        </div>
  
        <button class="btn btn-primary btn-lg w-100" (click)="goLogin()">Identificarse</button>
      </div>
</div>
