<div class="container mt-4">
    <h2 class="text-center mb-4">Listado de Charangas</h2>
  
    <!-- Filtro por provincia -->
    <div class="row mb-3">
      <div class="col-md-4">
        <select class="form-control" [(ngModel)]="filtroProvincia" (change)="obtenerCharangas()">
          <option value="">Todas las provincias</option>
          <option *ngFor="let provincia of provincias" [value]="provincia.idProvincia">{{ provincia.nombre }}
          </option>
        </select>
      </div>
    </div>
  
    <!-- Listado de Charangas -->
    <div *ngIf="charangasFiltradas.length > 0">
      <div *ngFor="let charanga of charangasFiltradas" class="charanga-card card mb-3 shadow">
        <div class="row g-0">
          <div class="col-md-3 d-flex align-items-center justify-content-center">
            <img [src]="charanga.foto" alt="Foto" class="rounded-circle img-fluid p-3">
          </div>
          <div class="col-md-9">
            <div class="card-body">
              <h5 class="card-title">{{ charanga.nombre }}</h5>
              <p class="card-text"><strong>Email:</strong> {{ charanga.email }}</p>
              <p class="card-text"><strong>Teléfono:</strong> {{ charanga.telefono }}</p>
              <p class="card-text"><strong>Provincia:</strong> {{ charanga.provincia }}</p>
              <p class="card-text"><strong>Año de Fundación:</strong> {{ charanga.fundacion }}</p>
              <p class="card-text"><strong>Biografía:</strong> {{ charanga.biografia }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Mensaje si no hay charangas -->
    <div *ngIf="charangasFiltradas.length === 0" class="alert alert-warning text-center mt-3">
      No se encontraron charangas.
    </div>
  </div>
